# Auto-update dataset riwayat Win Go 30s.
# Frontend hanya mengambil data saat halaman dibuka, jadi dataset di repo
# diperbarui dari server lewat workflow ini — tanpa perlu ada yang membuka web.
# Jadwal tiap 30 menit: aman terhadap limit deploy Vercel (maks ~48 deploy/hari),
# dan backend hanya mengembalikan 10 ronde terakhir per panggilan, jadi tiap run
# menangkap ~10 ronde terbaru (sampel, bukan semua ronde).
# Bisa juga dijalankan manual dari tab Actions (workflow_dispatch).

name: Update riwayat otomatis

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/workflows/update-riwayat.mjs
      - name: Commit bila ada ronde baru
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/riwayat.json
          git diff --cached --quiet && echo "Tidak ada ronde baru." || (git commit -m "Auto-update data/riwayat.json" && git push)
