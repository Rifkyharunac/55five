# Periodic collection preserves the existing 30-minute sample schedule.
name: Update riwayat otomatis
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-riwayat
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node .github/workflows/update-riwayat.mjs
        env:
          FIVE55_HISTORY_BODY: ${{ secrets.FIVE55_HISTORY_BODY }}
      - name: Commit bila ada ronde baru
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/riwayat.json
          if git diff --cached --quiet; then
            echo 'Tidak ada ronde baru.'
          else
            git commit -m 'Auto-update data/riwayat.json'
            git pull --rebase
            git push
          fi
