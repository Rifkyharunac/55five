<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>55FIVE • Panel Prediksi</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2e;--line:#26354a;--text:#edf3fb;--muted:#a8b7cb;--accent:#6de4ce}
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;padding:12px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;grid-template-rows:clamp(210px,32vh,350px) minmax(0,1fr);gap:12px;overflow:hidden}
.panel,.web55{min-width:0;min-height:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;box-shadow:0 8px 28px #0002}
.panel{display:flex;flex-direction:column}
.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--accent);color:#102a28;font-size:17px;font-weight:850;flex-shrink:0}
h1{font-size:17px;letter-spacing:.08em;margin:0;line-height:1.3}
.subtitle{margin:3px 0 0;font-size:12px;color:var(--muted)}
.period-label{font-size:12px;color:var(--accent);border:1px solid #6de4ce40;background:#6de4ce0b;padding:6px 10px;border-radius:999px;white-space:nowrap}
.table-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#415775 transparent}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:14px;font-variant-numeric:tabular-nums;text-align:center}
caption{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
th{position:sticky;top:0;z-index:1;background:#17243a;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:10px 6px;border-bottom:1px solid var(--line)}
th:nth-child(1){width:23%}th:nth-child(2){width:21%}th:nth-child(3){width:14%}th:nth-child(4){width:24%}th:nth-child(5){width:18%}
td{height:40px;padding:8px 6px;border-bottom:1px solid #26354a99;overflow-wrap:anywhere}
tbody tr:nth-child(even){background:#ffffff03}
tbody tr:first-child{background:#6de4ce08}
tbody tr:first-child td:first-child{box-shadow:inset 3px 0 var(--accent)}
td:first-child{font-weight:600;color:#c7d6e9}td:nth-child(2){font-weight:600}.count{color:var(--accent);font-weight:700}
.win{color:#75edb2;background:#75edb20a;font-weight:750}.lose{color:#ff9ba4;background:#ff9ba40a;font-weight:750}
.empty-state{margin:0;padding:20px;text-align:center;color:var(--muted);font-size:13px}.table-scroll:has(tbody tr) .empty-state{display:none}
.web55{display:flex;flex-direction:column;background:#0d1625}
.web-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;min-height:44px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);flex-shrink:0}
a{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
a:focus-visible,.table-scroll:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
iframe{display:block;flex:1;min-height:0;width:100%;border:0;background:#fff}
@media(max-width:600px){body{padding:8px;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom));gap:8px;grid-template-rows:clamp(220px,38vh,340px) minmax(0,1fr)}.panel,.web55{border-radius:12px}.panel-heading{padding:11px 12px;gap:8px}h1{font-size:15px}.subtitle{font-size:11px}.brand-mark{width:32px;height:32px;font-size:15px}.period-label{font-size:11px;padding:5px 8px}table{font-size:12px}th{font-size:10px;padding:9px 3px;letter-spacing:0}td{padding:8px 3px;height:38px}.web-heading{padding:0 12px}}
@media(max-height:500px){body{grid-template-rows:45% minmax(0,1fr);padding:6px;gap:6px}.panel-heading{padding:6px 12px}.brand-mark{width:28px;height:28px}.subtitle{display:none}td{height:32px;padding:5px}.web-heading{min-height:36px}th{padding:6px}}
@supports(height:100dvh){body{grid-template-rows:clamp(210px,32dvh,350px) minmax(0,1fr)}@media(max-width:600px){body{grid-template-rows:clamp(220px,38dvh,340px) minmax(0,1fr)}}@media(max-height:500px){body{grid-template-rows:45% minmax(0,1fr)}}}
</style>
</head>
<body>
<section class="panel" aria-labelledby="panel-title">
  <header class="panel-heading">
    <div class="brand"><span class="brand-mark" aria-hidden="true">55</span><div><h1 id="panel-title">55FIVE</h1><p class="subtitle">Ringkasan periode &amp; hasil</p></div></div>
    <span class="period-label">30 detik</span>
  </header>
  <div class="table-scroll" tabindex="0" role="region" aria-label="Riwayat prediksi, dapat digulir">
    <table>
      <caption>Prediksi dan hasil tiap periode</caption>
      <thead><tr><th scope="col">Periode</th><th scope="col">Prediksi</th><th scope="col">Sisa</th><th scope="col">Hasil</th><th scope="col">Status</th></tr></thead>
      <tbody id="dataBody"></tbody>
    </table>
    <p class="empty-state">Menunggu data periode…</p>
  </div>
</section>
<section class="web55" aria-label="Situs 55five">
  <div class="web-heading"><span>Situs 55five</span><a href="https://55x4mqd.com/#/home/" target="_blank" rel="noopener noreferrer">Buka penuh ↗</a></div>
  <iframe title="Situs 55five" src="https://55x4mqd.com/#/home/"></iframe>
</section>
<script>

let currentRow = null;
let timer = null;
let lastPeriode = null;   // periode berjalan (angka, mis. 51792)
let lastSisa = null;

function kategori(num){
  return num <= 4 ? "Kecil" : "Besar";
}

function buatPrediksi(){
  return Math.random() > 0.5 ? "Besar" : "Kecil";
}

async function ambilAPI(){
  try{
    const res = await fetch("/api?t=" + Date.now());
    return await res.json();
  }catch(e){
    console.log("API ERROR:", e);
    return null;
  }
}

function tambahBaris(periode){
  const tbody = document.getElementById("dataBody");
  const p = String(periode);
  if(tbody.firstChild && tbody.firstChild.dataset.periode === p) return; // cegah duplikat
  const tr = document.createElement("tr");
  tr.dataset.periode = p;
  tr.dataset.done = "0";
  tr.innerHTML = `
    <td>${p}</td>
    <td>${buatPrediksi()}</td>
    <td class="count">-</td>
    <td class="hasil">-</td>
    <td class="status">-</td>
  `;
  tbody.insertBefore(tr, tbody.firstChild);
  while(tbody.children.length > 30) tbody.removeChild(tbody.lastChild);
  currentRow = tr;
}

function isiHasil(tr, hasil){
  if(!tr || tr.dataset.done === "1") return;
  tr.dataset.done = "1";
  const kategoriHasil = kategori(hasil);
  tr.querySelector(".hasil").innerText = kategoriHasil + " " + hasil;
  const statusCell = tr.querySelector(".status");
  const prediksi = tr.children[1].innerText;
  if(prediksi === kategoriHasil){
    statusCell.innerText = "WIN";
    statusCell.className = "status win";
  }else{
    statusCell.innerText = "LOSE";
    statusCell.className = "status lose";
  }
}

// cocokkan hasil dari API ke baris yang periodenya sesuai
function cocokkanHasil(list){
  if(!Array.isArray(list)) return;
  document.querySelectorAll("#dataBody tr").forEach(tr => {
    if(tr.dataset.done === "1") return;
    const found = list.find(e => String(e.issueNumber).slice(-5) === tr.dataset.periode);
    // gunakan found.hasil (sudah di-parse oleh API, digit terakhir yang benar)
    if(found) isiHasil(tr, found.hasil);
  });
}

async function cekData(){
  const data = await ambilAPI();
  if(!data || data.error) return;
  cocokkanHasil(data.list);
  // sinkronisasi periode dari API: hanya update bila API melaporkan periode LEBIH BARU
  // (bukan sama dengan lastPeriode yang sudah di-increment lokal)
  const apiP = parseInt(data.periode, 10);
  if(!isNaN(apiP) && lastPeriode !== null && apiP > lastPeriode){
    lastPeriode = apiP;
    tambahBaris(apiP);
  }
}

function mulaiCountdown(){
  clearInterval(timer);
  timer = setInterval(() => {
    const now = new Date();
    const sec = now.getSeconds();

    // countdown sinkron 30 detik: sisa waktu sampai periode berikutnya
    // sec=0  → sisa=30, sec=1 → sisa=29, ..., sec=29 → sisa=1
    const sisa = 30 - (sec % 30);

    // Deteksi pergantian periode: ketika lastSisa kecil (≤3) lalu tiba-tiba jadi 30
    // Ini berarti countdown habis dan periode baru dimulai
    if(lastSisa !== null && lastSisa <= 3 && sisa === 30 && lastPeriode !== null){
      lastPeriode++;
      tambahBaris(lastPeriode);
    }
    lastSisa = sisa;

    if(currentRow){
      // tampilkan countdown; saat sisa=30 artinya baru mulai (30 detik penuh)
      currentRow.querySelector(".count").innerText = sisa;
    }

    // cek hasil tiap 2 detik
    if(sec % 2 === 0){
      cekData();
    }
  },1000);
}

async function start(){
  const data = await ambilAPI();
  if(!data || data.error) return;
  lastPeriode = parseInt(data.periode, 10);
  tambahBaris(lastPeriode);
  cocokkanHasil(data.list);
  mulaiCountdown();
}

start();

</script>
</body>
</html>
