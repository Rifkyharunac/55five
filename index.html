<!DOCTYPE html>
<html lang="id">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEB 55 PANEL</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  height:100dvh; overflow:hidden;
  display:flex;
  flex-direction:column;
}

.panel{
  flex: 0 0 45vh; box-sizing:border-box;
  background:#1c1c1c;
  overflow:auto;
  padding:10px;
}

.web55{
  flex:1; min-height:0; display:flex;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th,td{
  border:1px solid #333;
  padding:5px;
  text-align:center;
}

th{
  background:#222;
}

.win{
  color:#00ff00;
  font-weight:bold;
}

.lose{
  color:#ff0000;
  font-weight:bold;
}
p{font-size:13px;line-height:1.4;margin:8px 0;} td{white-space:nowrap;} button{padding:6px 10px;cursor:pointer;} </style>
</head>

<body>

<div class="panel"><p id="connection" role="status">Menghubungkan ke server...</p><button id="retry" type="button">Coba lagi</button><p>Prediksi eksperimen dari frekuensi maksimal 100 hasil sebelumnya. Minimal 10 hasil; data seimbang atau kurang akan dilewati. Tidak menjamin hasil berikutnya.</p><p id="accuracy"></p><p id="storage"></p>
  <table>
    <thead>
      <tr>
        <th>Periode</th>
        <th>Prediksi</th>
        <th>Data acuan</th><th>Sisa waktu</th>
        <th>Hasil</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="dataBody"></tbody>
  </table>
</div>

<div class="web55">
  <iframe title="Situs 55five" src="https://55x4mqd.com/#/home/"></iframe>
</div>

<script type="module" src="/app.mjs"></script>

</body>
</html>
